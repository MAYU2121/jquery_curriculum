<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね

    $('#wrapper').on('click', '#pokemon_search', showPokemon);
    $('#wrapper').on('click', '#catch', getPokemon);
    $('#wrapper').on('click', '[data-js="reset"]', reset);

    function showPokemon() {
      let encountHtml =
        `
        <p class="name"></p>
        <div>
          <img class="img" src="" alt="">
        </div>
        <div>
          <button class="btn" id="catch">捕まえる</button>
          <button class="btn" data-js="reset">逃げる</button>
        </div>
        `;
      $('#wrapper').html(encountHtml);

      const pokemonId = Math.floor(Math.random() * 151) + 1;

      $.ajax({
        url: `https://pokeapi.co/api/v2/pokemon-species/${pokemonId}/`,
        method: 'GET'
      }).done(function (res) {
        const pokeName = res.names.find(n => n.language.name === 'ja-Hrkt').name;
        $('.name').text(pokeName);
      })
      $.ajax({
        url: `https://pokeapi.co/api/v2/pokemon/${pokemonId}/`,
        method: 'GET'
      }).done(function (res) {
        const pokeImg = res.sprites.front_default;
        $('.img').attr('src', pokeImg);
      })

      $('.search-btn').hide();

    }

    function getPokemon() {

      let doneHtml =
        `
        <p class="name">ゲットしました</p>
        <div>
          <img class="img" src="" alt="">
        </div>
        <button class="btn" data-js="reset">戻る</button>        
      `;
      let failHtml =
        `
        <p class="text">逃げられてしまった...</p>
        <button class="btn mt" data-js="reset">戻る</button>
        `;
      const fiftyFifty = Math.floor(Math.random() * 2);

      if (fiftyFifty === 0) {
        $('#wrapper').html(doneHtml);
        $.ajax({
          url: 'https://pokeapi.co/api/v2/item/4',
          method: 'GET'
        }).done(function (res) {
          console.log(res);
          const capsuleImg = res.sprites.default;
          $('.img').attr('src', capsuleImg);
        })
      } else {
        $('#wrapper').html(failHtml);
      }

    };

    function reset() {
      $('#wrapper').html('<button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>');
    }
  </script>
</body>

</html>
